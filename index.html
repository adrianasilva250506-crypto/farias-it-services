<meta charset="UTF-8">

<style>
  :root{
    --bg:#f7f8fc; --surface:#ffffff; --text:#14172b; --muted:#5b6078;
    --primary:#3b5bfd; --primary-dark:#2a44d4; --accent:#12b8a6;
    --border:#e3e6f0; --hero1:#1b2050; --hero2:#3b5bfd;
    --shadow:0 10px 30px rgba(20,23,43,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1020; --surface:#171a30; --text:#eef0fa; --muted:#a3a8c3;
      --border:#2a2e4a; --shadow:0 10px 30px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}

  /* Header */
  header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem}
  .logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;color:#fff;font-weight:800}
  .links{display:flex;gap:24px;font-weight:500;color:var(--muted)}
  .links a:hover{color:var(--primary)}
  .lang{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
  .lang button{border:0;background:transparent;color:var(--muted);padding:6px 12px;font:600 .85rem 'Inter',sans-serif;cursor:pointer}
  .lang button.active{background:var(--primary);color:#fff}
  @media (max-width:760px){.links{display:none}}

  /* Hero */
  .hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;padding:90px 0 100px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.07)}
  .badge{display:inline-block;background:rgba(255,255,255,.15);padding:6px 14px;border-radius:999px;font-size:.85rem;font-weight:600;margin-bottom:18px}
  .hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.15;font-weight:800;max-width:760px}
  .hero p{font-size:1.15rem;opacity:.9;max-width:620px;margin:18px 0 32px}
  .btns{display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-block;padding:14px 26px;border-radius:12px;font-weight:700;transition:transform .15s}
  .btn:hover{transform:translateY(-2px)}
  .btn-white{background:#fff;color:var(--hero1)}
  .btn-ghost{border:2px solid rgba(255,255,255,.6);color:#fff}

  /* Sections */
  section{padding:80px 0}
  .eyebrow{color:var(--primary);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.8rem}
  h2{font-size:clamp(1.7rem,3.5vw,2.4rem);font-weight:800;margin:8px 0 12px}
  .lead{color:var(--muted);max-width:640px;margin-bottom:40px}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:var(--shadow);transition:transform .2s}
  .card:hover{transform:translateY(-4px)}
  .icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;background:color-mix(in srgb,var(--primary) 12%,transparent);margin-bottom:16px}
  .card h3{font-size:1.15rem;margin-bottom:8px}
  .card p{color:var(--muted);font-size:.95rem}
  .card ul{margin-top:12px;padding-left:18px;color:var(--muted);font-size:.9rem}

  .alt{background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;counter-reset:s}
  .step{padding:24px;border-radius:16px;border:1px dashed var(--border)}
  .step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;margin-bottom:12px}
  .step h3{font-size:1.05rem;margin-bottom:6px}
  .step p{color:var(--muted);font-size:.93rem}

  .why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
  .why div{display:flex;gap:12px;align-items:flex-start}
  .why span{font-size:1.4rem}
  .why p{color:var(--muted);font-size:.93rem}
  .why strong{display:block;color:var(--text)}

  /* Contact */
  .contact{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:24px;padding:50px 30px;text-align:center}
  .contact h2{color:#fff}
  .contact p{opacity:.9;max-width:560px;margin:0 auto 26px}
  .contact-info{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:24px;font-weight:500;opacity:.95}

  footer{padding:30px 0;text-align:center;color:var(--muted);font-size:.9rem}
</style>

function setLang(lang){
  if(!T[lang]) lang = "en";
  const d = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.dataset.i18n;
    if(d[k] !== undefined) el.textContent = (el.tagName==="SPAN" && el.previousElementSibling && el.previousElementSibling.tagName==="STRONG") ? d[k] : d[k];
  });
  document.querySelectorAll("[data-i18n-list]").forEach(ul=>{
    ul.innerHTML = "";
    (d[ul.dataset.i18nList]||[]).forEach(t=>{ const li=document.createElement("li"); li.textContent=t; ul.appendChild(li); });
  });
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("active", b.dataset.lang===lang));
  try{ localStorage.setItem("farias_lang", lang); }catch(e){}
}

document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
document.getElementById("year").textContent = new Date().getFullYear();

let saved = null;
try{ saved = localStorage.getItem("farias_lang"); }catch(e){}
const browser = (navigator.language||"en").slice(0,2);
setLang(saved || (T[browser] ? browser : "en"));
